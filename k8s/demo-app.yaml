# 演示应用的 Kubernetes 部署清单
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: demo-api
          image: demo-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: OTEL_SERVICE_NAME
              value: demo-api
            # 上报到 Tempo 的 OTLP/HTTP 接口
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318/v1/traces
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  type: NodePort
  selector:
    app: demo-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
